<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop · Bloom & Belle</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="nav"><a class="brand" href="index.html">Bloom & Belle</a><nav class="navlinks"><a href="products.html">Shop</a><a href="cart.html">Cart (<span id="cartCount">0</span>)</a><span id="authArea"></span></nav></header>
<main class="container section"><h1>Shop</h1><div class="toolbar"><input id="search" class="input" placeholder="Search products..."><select id="category" class="select"><option value="">All categories</option></select><select id="sort" class="select"><option value="">Featured</option><option value="price_asc">Price: Low to High</option><option value="price_desc">Price: High to Low</option></select></div><div id="products" class="grid"></div></main>
<script src="js/api.js"></script><script src="js/common.js"></script><script>
let timer;async function load(){const q=new URLSearchParams({search:search.value,category:category.value,sort:sort.value});const p=await api("/products?"+q);products.innerHTML=p.map(x=>`<article class="card"><a href="product.html?id=${x.id}"><img src="${esc(x.image)}"><div class="cardbody"><h3>${esc(x.name)}</h3><p class="price">${money(x.price)}</p><p class="muted">${esc(x.category)} · ${x.stock} left</p></div></a></article>`).join("")||"<p>No products found.</p>";}
(async()=>{const p=await api("/products");[...new Set(p.map(x=>x.category))].forEach(c=>category.insertAdjacentHTML("beforeend",`<option>${esc(c)}</option>`));load()})();search.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};category.onchange=sort.onchange=load;
</script></body></html>
