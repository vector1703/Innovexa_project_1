<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product · Bloom & Belle</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="nav"><a class="brand" href="index.html">Bloom & Belle</a><nav class="navlinks"><a href="products.html">Shop</a><a href="cart.html">Cart</a><span id="authArea"></span></nav></header>
<main class="container section" id="product"></main>
<script src="js/api.js"></script><script src="js/common.js"></script><script>
(async()=>{try{const id=new URLSearchParams(location.search).get("id");const p=await api("/products/"+id);product.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:40px"><img style="width:100%;max-height:600px;object-fit:cover;border-radius:18px" src="${esc(p.image)}"><div><p class="muted">${esc(p.category)}</p><h1>${esc(p.name)}</h1><p class="price">${money(p.price)}</p><p>${esc(p.description)}</p><p><b>Sizes:</b> ${Array.isArray(p.sizes)?p.sizes.join(", "):esc(p.sizes)}</p><p><b>Colors:</b> ${Array.isArray(p.colors)?p.colors.join(", "):esc(p.colors)}</p><p>${p.stock} available</p><input id="qty" class="input" type="number" min="1" max="${p.stock}" value="1" style="max-width:100px"><br><br><button class="btn" onclick="add('${p.id||p._id}')">Add to Cart</button></div></div>`}catch(e){product.innerHTML="<h2>Product not found</h2>"}})();
async function add(id){if(!getToken())return location.href="login.html";try{await api("/cart",{method:"POST",body:JSON.stringify({productId:id,quantity:Number(qty.value)})});alert("Added to cart");location.href="cart.html"}catch(e){alert(e.message)}}
</script></body></html>
