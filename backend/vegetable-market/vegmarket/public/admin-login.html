<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VegMarket Admin Login</title>

<link
    rel="stylesheet"
    href="/css/style.css"
>

</head>

<body class="auth-body">


<div class="auth-card">

    <div class="admin-logo">
        🔐
    </div>


    <h1>
        Admin Login
    </h1>


    <p>
        VegMarket Management System
    </p>


    <form id="adminLoginForm">


        <label>
            Admin Password
        </label>


        <input
            type="password"
            id="adminPassword"
            placeholder="Enter admin password"
            required
        >


        <button
            type="submit"
            class="primary-btn full"
        >
            Login
        </button>


    </form>


    <p id="message"></p>


    <a
        href="/"
        class="back-link"
    >
        ← Home
    </a>

</div>


<script>

const form =
    document.getElementById(
        "adminLoginForm"
    );

const password =
    document.getElementById(
        "adminPassword"
    );

const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        message.textContent =
            "Checking password...";


        try {

            const response =
                await fetch(
                    "/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            password:
                                password.value

                        })
                    }
                );


            const data =
                await response.json();


            if (
                response.ok &&
                data.success
            ) {

                message.textContent =
                    "Login successful";

                message.className =
                    "success";


                setTimeout(
                    () => {

                        window.location.href =
                            "/admin";

                    },
                    500
                );

            } else {

                message.textContent =
                    data.message;

                message.className =
                    "error";

                password.value = "";

            }


        } catch (error) {

            console.error(error);

            message.textContent =
                "Server connection failed";

            message.className =
                "error";
        }
    }
);

</script>

</body>

</html>
