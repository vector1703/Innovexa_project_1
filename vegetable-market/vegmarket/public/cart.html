<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VegMarket Cart</title>

<link
    rel="stylesheet"
    href="/css/style.css"
>

</head>

<body>


<header class="store-header">

    <div class="logo">
        🥕 VegMarket
    </div>

    <nav>

        <a href="/store1">
            Shop
        </a>

        <a href="/">
            Home
        </a>

    </nav>

</header>


<main class="section">

    <h1>
        🛒 Your Cart
    </h1>


    <div id="cartContainer">

        Loading...

    </div>


    <div
        id="checkoutBox"
        class="checkout-box hidden"
    >

        <h2>
            Checkout
        </h2>


        <input
            type="tel"
            id="phone"
            placeholder="Phone number"
        >


        <button
            id="checkoutBtn"
            class="primary-btn"
        >
            Place Order
        </button>

    </div>


    <p id="message"></p>

</main>


<script src="/js/cart.js"></script>

</body>

</html>
