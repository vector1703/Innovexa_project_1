<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Products</title>

<link
    rel="stylesheet"
    href="/css/style.css"
>

</head>

<body>


<header class="admin-header">

    <div class="logo">
        🥕 Admin Products
    </div>


    <nav>

        <a href="/admin">
            Dashboard
        </a>

        <a href="/admin/orders">
            Orders
        </a>

    </nav>

</header>


<main class="section">


    <h1>
        🥬 Product Management
    </h1>


    <!-- ADD PRODUCT -->

    <div class="admin-form">

        <h2>
            Add New Vegetable
        </h2>


        <form id="productForm">


            <input
                type="text"
                id="storeSlug"
                value="store1"
                placeholder="Store slug"
                required
            >


            <input
                type="text"
                id="productName"
                placeholder="Vegetable name"
                required
            >


            <input
                type="number"
                id="productPrice"
                placeholder="Price"
                min="1"
                required
            >


            <input
                type="text"
                id="productUnit"
                placeholder="Unit"
                value="kg"
            >


            <input
                type="text"
                id="productEmoji"
                placeholder="Emoji"
                value="🥦"
            >


            <input
                type="number"
                id="productStock"
                placeholder="Stock"
                value="100"
                min="0"
            >


            <button
                type="submit"
                class="primary-btn"
            >
                + Add Product
            </button>


        </form>


        <p id="message"></p>

    </div>


    <!-- PRODUCTS -->

    <h2>
        Current Products
    </h2>


    <div
        id="productsContainer"
        class="product-grid"
    >

        Loading...

    </div>


</main>


<script>

const form =
    document.getElementById(
        "productForm"
    );


const message =
    document.getElementById(
        "message"
    );


const container =
    document.getElementById(
        "productsContainer"
    );


// ==========================================
// LOAD PRODUCTS
// ==========================================

async function loadProducts() {

    try {

        const response =
            await fetch(
                "/api/admin/products"
            );


        if (
            response.status === 401
        ) {

            window.location.href =
                "/admin-login.html";

            return;
        }


        const data =
            await response.json();


        container.innerHTML =
            "";


        data.products.forEach(
            product => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product-card";


                card.innerHTML = `

                    <div class="product-emoji">
                        ${product.emoji}
                    </div>

                    <h3>
                        ${product.name}
                    </h3>

                    <p>
                        ₹${product.price}
                        / ${product.unit}
                    </p>

                    <p>
                        Stock:
                        ${product.stock}
                    </p>

                    <p>
                        Store:
                        ${product.store_slug}
                    </p>

                    <button
                        class="danger-btn"
                        onclick="
                            deleteProduct(
                                ${product.id}
                            )
                        "
                    >
                        Delete
                    </button>

                `;


                container.appendChild(
                    card
                );
            }
        );


    } catch (error) {

        console.error(error);

        container.textContent =
            "Cannot load products";
    }
}


// ==========================================
// ADD
// ==========================================

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const body = {

            storeSlug:
                document.getElementById(
                    "storeSlug"
                ).value.trim(),

            name:
                document.getElementById(
                    "productName"
                ).value.trim(),

            price:
                Number(
                    document.getElementById(
                        "productPrice"
                    ).value
                ),

            unit:
                document.getElementById(
                    "productUnit"
                ).value.trim(),

            emoji:
                document.getElementById(
                    "productEmoji"
                ).value.trim(),

            stock:
                Number(
                    document.getElementById(
                        "productStock"
                    ).value
                )

        };


        try {

            const response =
                await fetch(
                    "/api/admin/products",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                body
                            )
                    }
                );


            const data =
                await response.json();


            message.textContent =
                data.message;


            message.className =
                data.success
                    ? "success"
                    : "error";


            if (data.success) {

                form.reset();

                document.getElementById(
                    "storeSlug"
                ).value =
                    "store1";

                document.getElementById(
                    "productUnit"
                ).value =
                    "kg";

                document.getElementById(
                    "productEmoji"
                ).value =
                    "🥦";

                document.getElementById(
                    "productStock"
                ).value =
                    "100";


                loadProducts();
            }


        } catch (error) {

            console.error(error);

            message.textContent =
                "Server error";

            message.className =
                "error";
        }
    }
);


// ==========================================
// DELETE
// ==========================================

async function deleteProduct(
    id
) {

    const response =
        await fetch(

            `/api/admin/products/${id}`,

            {
                method: "DELETE"
            }
        );


    const data =
        await response.json();


    message.textContent =
        data.message;


    message.className =
        data.success
            ? "success"
            : "error";


    if (data.success) {

        loadProducts();
    }
}


loadProducts();

</script>

</body>

</html>
