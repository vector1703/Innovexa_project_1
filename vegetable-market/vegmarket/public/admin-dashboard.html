<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VegMarket Admin Dashboard</title>

<link
    rel="stylesheet"
    href="/css/style.css"
>

</head>

<body>


<header class="admin-header">

    <div class="logo">
        🥕 VegMarket Admin
    </div>


    <button
        id="logoutBtn"
        class="danger-btn"
    >
        Logout
    </button>

</header>


<main class="section">


    <h1>
        Admin Dashboard
    </h1>


    <div class="dashboard-grid">


        <a
            href="/admin/orders"
            class="dashboard-card"
        >

            <div class="icon">
                📦
            </div>

            <h2>
                Orders
            </h2>

            <p>
                View and complete customer orders.
            </p>

        </a>


        <a
            href="/admin/products"
            class="dashboard-card"
        >

            <div class="icon">
                🥬
            </div>

            <h2>
                Products
            </h2>

            <p>
                Add and delete vegetables.
            </p>

        </a>


        <a
            href="/store1"
            class="dashboard-card"
        >

            <div class="icon">
                🛒
            </div>

            <h2>
                View Store
            </h2>

            <p>
                Open customer store.
            </p>

        </a>


        <a
            href="/"
            class="dashboard-card"
        >

            <div class="icon">
                🌐
            </div>

            <h2>
                Home
            </h2>

            <p>
                Return to main website.
            </p>

        </a>


    </div>


    <div class="stats">

        <div class="stat">

            <h3>
                Pending Orders
            </h3>

            <strong id="orderCount">
                --
            </strong>

        </div>


        <div class="stat">

            <h3>
                Products
            </h3>

            <strong id="productCount">
                --
            </strong>

        </div>

    </div>


</main>


<script src="/js/admin.js"></script>

</body>

</html>
